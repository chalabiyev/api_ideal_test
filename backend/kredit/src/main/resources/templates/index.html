<!DOCTYPE html>
<html>
<head>
    <title>PDF Example</title>
    <style>
        body {
            font-family: "Roboto", sans-serif;
            margin: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .content {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>Welcome, ${name}</h1>
    <p>Generated on: ${date}</p>
</div>
<div class="content">
    <p>Your ID is: ${id}</p>
    <p>This document is dynamically generated.</p>
</div>
</body>
</html>
