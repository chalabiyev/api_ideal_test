<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&amp;display=swap"
        rel="stylesheet" />
    <title>Sənədin tərkib hissələri</title>
</head>

<body>

    <p style="line-height:107%;margin:0cm 0cm 8pt;">
        <span style="font-family:Calibri, sans-serif;font-size:11pt;">
            <img th:src="@{sened_img.png}" alt="Header Logo" class="image" width="941" height="282" />
        </span>
    </p>

    <figure class="table">
        <table class="ck-table-resized" style="border-collapse:collapse;border-style:none;" border="1" cellspacing="0"
            cellpadding="0">
            <tbody>
                <!-- Document Number and Date -->
                <tr>
                    <td style="border-bottom:2.25pt solid windowtext;border-left-style:none;border-right-style:none;border-top:2.25pt solid windowtext;padding:0cm 5.4pt;vertical-align:top;width:467.5pt;"
                        colspan="2" width="623">
                        <p style="line-height:normal;margin:0cm;">
                            <span style="color:black;font-family:'Open Sans Bold';font-size:15.0pt;">
                                <strong>№ İК-BSİ/<span th:text="${creditOrderNoStr}"></span>/<span
                                        th:text="${creditYear}"></span></strong>
                                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                                <strong><span th:text="${requestDateStr}"></span></strong>
                            </span>
                        </p>
                    </td>
                </tr>

                <!-- Document Contents -->
                <tr>
                    <td style="border-bottom:2.25pt solid windowtext;border-left-style:none;border-right-style:none;border-top-style:none;padding:0cm 5.4pt;vertical-align:top;width:467.5pt;"
                        colspan="2" width="623">
                        <p style="line-height:150%;margin:6.0pt 0cm;">
                            <span style="color:black;font-family:'Open Sans Bold';font-size:15.0pt;">
                                <strong>Sənədin tərkib hissələri:</strong>
                            </span>
                        </p>
                        <ol style="padding-left:30px;">
                            <li>Qaimə</li>
                            <li>Ərizə</li>
                            <li>Kredit sifarişi</li>
                            <li>İstehlak krediti müqaviləsi üzrə standart məlumatlandırma forması</li>
                            <li>Əlaqəli kredit müqaviləsi</li>
                            <li>Müştərinin kredit tarixçəsinin tərtib edilməsi üçün məlumatların kredit bürosuna təqdim
                                edilməsinə və ya kredit bürosundan kredit hesabatının əldə edilməsinə razılıq ərizəsi
                            </li>
                            <li>Müştərinin “ASAN” Finans sistemi vasitəsilə məlumatların alınmasına dair razılıq ərizəsi
                            </li>
                            <li>Ödəniş cədvəli</li>
                        </ol>
                    </td>
                </tr>

                <!-- Guarantor Section -->
                <tr>
                    <td style="border-bottom:2.25pt solid windowtext;border-left-style:none;border-right-style:none;border-top-style:none;padding:0cm 5.4pt;vertical-align:top;width:467.5pt;"
                        colspan="2" width="623">
                        <p style="line-height:140%;margin:6.0pt 0cm;">
                            <span style="color:black;font-family:'Open Sans Bold';font-size:15.0pt;">
                                <strong>Zamin (tələb olunarsa):</strong>
                            </span>
                        </p>
                        <ol style="padding-left:30px;">
                            <li>Zaminlik müqaviləsi</li>
                            <li>Zaminə aid kredit tarixçəsinin tərtib edilməsi üçün məlumatların kredit bürosuna təqdim
                                edilməsinə və ya kredit bürosundan kredit hesabatının əldə edilməsinə razılıq ərizəsi
                            </li>
                            <li>“ASAN” Finans sistemi vasitəsilə zaminə aid məlumatların alınmasına dair razılıq ərizəsi
                            </li>
                        </ol>
                    </td>
                </tr>

                <!-- Footer with Signature and QR Code -->
                <tr>
                    <td style="border-bottom:2.25pt solid windowtext;border-left-style:none;border-right-style:none;border-top-style:none;padding:0cm 5.4pt;vertical-align:top;width:234.5pt;"
                        width="313">
                        <p style="line-height:115%;margin:12.0pt 0cm 0cm;">
                            <span style="color:black;font-family:'Open Sans Bold';font-size:12.0pt;">
                                <strong>Sənəd SİMA İMZA</strong>
                            </span>
                        </p>
                        <p style="line-height:115%;margin:0cm;">
                            <span style="color:black;font-family:'Open Sans Bold';font-size:12.0pt;">
                                <strong>vasitəsi ilə imzalanıb</strong>
                            </span>
                        </p>
                        <p style="line-height:115%;margin:6.0pt 0cm 0cm;">
                            <span style="color:black;font-family:'Open Sans',sans-serif;font-size:11pt;">Sənədin
                                həqiqiliyini QR kod vasitəsi ilə</span>
                        </p>
                        <p style="line-height:115%;margin:0cm;">
                            <span style="color:black;font-family:'Open Sans',sans-serif;font-size:11pt;">yoxlamağınız
                                tövsiyyə edilir</span>
                        </p>
                        <p style="line-height:normal;margin:0cm;">
                            <a target="_blank" rel="noopener noreferrer" href="http://www.idealkredit.az">
                                www.idealkredit.az
                            </a>
                        </p>
                    </td>
                    <td style="border-bottom:2.25pt solid windowtext;border-left-style:none;border-right-style:none;border-top-style:none;padding:0cm 5.4pt;vertical-align:top;width:233.0pt;"
                        width="311">
                        <img th:src="@{sened_qr.png}" alt="QR Code" class="image image-style-side" width="127"
                            height="127" />
                    </td>
                </tr>
            </tbody>
        </table>
    </figure>

</body>

</html>
