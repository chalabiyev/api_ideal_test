pipelines:
  default:
    - parallel:
      - step:
          name: Backend Build and Test
          image: maven:3.8.7
          caches:
            - maven
          script:
            - cd backend/kredit
            - ./mvnw verify --file pom.xml
          after-script:              
            - pipe: atlassian/checkstyle-report:0.3.0              
  branches:
    main:
      - step:
          name: Backend Build For Deploy
          script:
            - cd backend/kredit
            - mvn clean install -DskipTests            
            - zip -j application.zip target/kredit-0.0.1-SNAPSHOT.jar
          artifacts:
            - application.zip
      - step:
          name: Backend Deploy to Production
          deployment: Production
          trigger: manual
          script:
            - pipe: atlassian/scp-deploy:1.5.1
              variables:
                USER: 'esam'
                SERVER: '46.202.143.42'
                REMOTE_PATH: '~/'
                LOCAL_PATH: 'application.zip'
                SSH_KEY: $MY_SSH_KEY